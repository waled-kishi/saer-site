title: كتاب
'@extends':
  type: content-base
  context: theme://blueprints

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.subtitle:
              type: text
              label: العنوان الفرعي (اختياري)
              ordering@: header.title
            header.author:
              type: text
              label: المؤلف
              default: محمد سائر الشبعان
              ordering@: header.subtitle
        book:
          type: tab
          title: بيانات الكتاب
          fields:
            book_help:
              type: display
              label: طريقة الاستخدام
              markdown: true
              content: "1. ارفع الغلاف وملفات الكتاب من **وسائط الصفحة** (تبويب المحتوى).\n2. اختر الغلاف من حقل **صورة الغلاف**.\n3. أضف كل ملف بسطر تحت **ملفات التحميل**، ولكل ملف اسم مثل \"الجزء الأول\". الملفات المرفوعة وغير المختارة هنا ما بتظهر للزوار."
            header.cover:
              type: media
              label: صورة الغلاف
              sources: [page]
              accept: ['image/*']
            header.files:
              type: list
              label: ملفات التحميل
              btnLabel: إضافة ملف
              collapsed: false
              fields:
                .label:
                  type: text
                  label: اسم الزر
                  placeholder: "مثلاً: الجزء الأول، أو اتركه فارغاً لـ \"تحميل الكتاب\""
                .file:
                  type: media
                  label: الملف
                  sources: [page]
                  accept: ['application/pdf', 'application/epub+zip', 'application/zip']
            header.download_form:
              type: select
              label: النموذج قبل التحميل
              default: ''
              options:
                '': الافتراضي للموقع (إجباري)
                required: إجباري
                optional: اختياري (مع زر تخطٍّ)
                off: بدون نموذج
            header.status:
              type: select
              label: حالة الكتاب
              default: available
              options:
                available: متاح للتحميل
                soon: قريباً
                print: ورقي فقط
            header.year:
              type: text
              label: سنة النشر
            header.pages:
              type: number
              label: عدد الصفحات
              validate:
                min: 0
            header.publisher:
              type: text
              label: الناشر
            header.read_url:
              type: text
              label: رابط قراءة خارجي (اختياري)
              help: مثل موقع الكتاب المستقل. يظهر زر "اقرأ على الموقع".
            header.toc:
              type: array
              label: فهرس الفصول (اختياري)
              value_only: true
            header.related:
              type: select
              label: برنامج أو سلسلة مرتبطة
              help: اختر "بدون ربط" لإلغاء الربط.
              default: ''
              data-options@: '\Grav\Theme\Saer::seriesOptions'
