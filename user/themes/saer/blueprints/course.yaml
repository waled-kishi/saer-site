title: دورة
'@extends':
  type: content-base
  context: theme://blueprints

form:
  fields:
    tabs:
      fields:
        course:
          type: tab
          title: بيانات الدورة
          fields:
            header.image:
              type: media
              label: صورة الدورة
              sources: [page]
              accept: ['image/*']
            header.status:
              type: select
              label: حالة التسجيل
              default: soon
              options:
                soon: قريباً
                open: التسجيل مفتوح
                closed: التسجيل مغلق
                done: انتهت الدورة
            header.start_date:
              type: text
              label: موعد البدء
              placeholder: "مثلاً: السبت 5 كانون الأول 2026"
            header.duration:
              type: text
              label: المدة
              placeholder: "مثلاً: 6 أسابيع، لقاء أسبوعي"
            header.format:
              type: text
              label: طريقة الحضور
              placeholder: "أونلاين / حضوري"
            header.price:
              type: text
              label: الرسوم
              placeholder: مجانية
            header.trailer:
              type: text
              label: فيديو تعريفي على يوتيوب (اختياري)
            header.audience:
              type: textarea
              label: لمن هذه الدورة؟
              rows: 3
            header.goals:
              type: array
              label: ماذا ستتعلم (نقاط)
              value_only: true
            header.outline:
              type: array
              label: محاور الدورة بالترتيب
              value_only: true
            header.batch:
              type: text
              label: اسم الدفعة (اختياري)
              placeholder: "مثلاً: الدفعة الثانية"
        landing:
          type: tab
          title: صفحة الهبوط
          fields:
            landing_info:
              type: display
              markdown: true
              content: "كل قسم هون بيظهر بالصفحة **فقط إذا عبّيته**. اتركه فاضي ← القسم بيختفي."
            header.promise:
              type: text
              label: وعد الدورة (العنوان الكبير)
              help: النتيجة لا اسم الدورة. مثال "ليس التعب من كثرة العمل، بل من دوائر تدور فيها بلا مخرج".
            header.trust_facts:
              type: array
              label: شريط الثقة (أرقام وحقائق قصيرة)
              value_only: true
              placeholder_value: "مثلاً: +70 ألف متدرّب"
            header.pains:
              type: array
              label: "هل تجد نفسك هنا؟ (حالات قبل الدورة)"
              value_only: true
            header.curriculum:
              type: list
              label: المنهج (لقاء/محور لكل سطر)
              collapsed: true
              fields:
                .title:
                  type: text
                  label: العنوان
                .text:
                  type: text
                  label: سطر الوصف
            header.not_for:
              type: array
              label: لمن ليست هذه الدورة
              value_only: true
            header.how_it_runs:
              type: list
              label: كيف تجري الدورة
              collapsed: true
              fields:
                .title:
                  type: text
                  label: العنصر
                  placeholder: "المنصة · التوقيت · التسجيلات · الشهادة"
                .text:
                  type: text
                  label: التفصيل
            header.testimonials:
              type: list
              label: آراء المتدربين
              collapsed: true
              fields:
                .name:
                  type: text
                  label: الاسم
                .text:
                  type: textarea
                  label: الرأي
                  rows: 2
            header.faq:
              type: list
              label: الأسئلة الشائعة
              collapsed: true
              fields:
                .q:
                  type: text
                  label: السؤال
                .a:
                  type: textarea
                  label: الجواب
                  rows: 2
            header.sticky_cta:
              type: toggle
              label: شريط التسجيل الثابت أسفل الشاشة (موبايل)
              default: 1
              highlight: 1
              options: { 1: نعم, 0: لا }
              validate: { type: bool }
            popup_group:
              type: fieldset
              title: العرض الخاص (نافذة منبثقة)
              icon: sparkles
              collapsible: true
              collapsed: true
              fields:
                popup_info:
                  type: display
                  markdown: true
                  content: "النافذة بتطلع مرة وحدة لكل زائر، ومعها مهلة حقيقية بتنتهي فعلاً: بعدها بتختفي النافذة والشارة من جهازه. **التزم فيها** — يلي بتنتهي مهلته ما بياخد السعر الخاص."
                header.popup:
                  type: toggle
                  label: تشغيل النافذة
                  default: 0
                  highlight: 1
                  options: { 1: نعم, 0: لا }
                  validate: { type: bool }
                header.popup_hours:
                  type: number
                  label: مدة العرض بالساعات
                  default: 3
                header.popup_badge:
                  type: text
                  label: شارة صغيرة فوق العنوان
                  placeholder: عرض خاص
                header.popup_title:
                  type: text
                  label: عنوان النافذة
                  placeholder: عرضك الخاص
                header.popup_text:
                  type: textarea
                  label: نص النافذة
                  rows: 2
                header.popup_price:
                  type: text
                  label: سعر العرض الخاص (اتركه فاضي ليعرض سعر الدورة)
                  placeholder: "39$"
                header.popup_cta:
                  type: text
                  label: نص زر النافذة
                  placeholder: احجز بالسعر الخاص
            header.countdown:
              type: toggle
              label: عدّاد تنازلي لآخر موعد للتسجيل
              default: 1
              highlight: 1
              options: { 1: نعم, 0: لا }
              validate: { type: bool }
        register:
          type: tab
          title: التسجيل
          fields:
            register_info:
              type: display
              markdown: true
              content: "اختر **طريقة التسجيل**، وبعدين افتح المجموعة الخاصة فيها تحت. زر التسجيل ما بيظهر بالموقع إلا إذا كانت حالة التسجيل **مفتوح** وما انتهى الموعد النهائي."
            header.register_mode:
              type: select
              label: طريقة التسجيل
              default: external
              options:
                external: رابط خارجي (فورم غوغل)
                internal: نموذج تسجيل على الموقع
                none: بلا زر تسجيل
            header.register_label:
              type: text
              label: نص الزر
              placeholder: سجّل الآن
            header.register_deadline:
              type: date
              label: آخر موعد للتسجيل
              help: بآخر هذا اليوم بينغلق التسجيل لحاله. اتركه فاضي إذا ما في موعد نهائي.
            price_group:
              type: fieldset
              title: السعر والخصم
              icon: tag
              collapsible: true
              collapsed: false
              fields:
                header.price_before:
                  type: text
                  label: السعر قبل الخصم (بينعرض مشطوب)
                  help: خلّيه سعرك المعتاد الحقيقي. اتركه فاضي إذا ما في خصم.
                  placeholder: "75$"
                header.price_note:
                  type: text
                  label: سطر تحت السعر
                  placeholder: "الرسوم تُدفع بالليرة بسعر اليوم"
            pay_group:
              type: fieldset
              title: الدفع والتواصل (بقسم التسجيل)
              icon: wallet
              collapsible: true
              collapsed: false
              fields:
                pay_info:
                  type: display
                  markdown: true
                  content: "كل عنصر هون بيظهر فقط إذا عبّيته: صورة الـQR، وزر الواتساب. الصورة لازم تكون مرفوعة بوسائط هالصفحة أولاً."
                header.pay_qr:
                  type: media
                  label: صورة QR للدفع (شام كاش)
                  sources: [page]
                  accept: ['image/*']
                header.pay_title:
                  type: text
                  label: عنوان قسم الدفع
                  placeholder: ادفع عبر شام كاش
                header.pay_note:
                  type: textarea
                  label: تعليمات الدفع
                  rows: 2
                  placeholder: "امسح الرمز وادفع الرسوم، ثم أرسل صورة الإشعار على الواتساب."
                header.whatsapp:
                  type: text
                  label: رقم الواتساب
                  help: مع رمز الدولة وبلا رموز، مثل 963912345678.
                header.whatsapp_label:
                  type: text
                  label: نص زر الواتساب
                  placeholder: تواصل معنا على واتساب
                header.whatsapp_text:
                  type: text
                  label: الرسالة الجاهزة بالواتساب
                  placeholder: "السلام عليكم، أريد التسجيل في دورة …"
            external_group:
              type: fieldset
              title: 'إذا اخترت: رابط خارجي (فورم غوغل)'
              icon: link
              collapsible: true
              collapsed: false
              fields:
                header.register_url:
                  type: url
                  label: رابط التسجيل
                  placeholder: https://forms.gle/...
                header.register_note:
                  type: text
                  label: ملاحظة تحت الزر (اختياري)
                  placeholder: "مثلاً: التسجيل عبر نموذج غوغل، وبيوصلك تأكيد على الواتساب"
            internal_group:
              type: fieldset
              title: 'إذا اخترت: نموذج تسجيل على الموقع'
              icon: list-checks
              collapsible: true
              collapsed: true
              fields:
                internal_info:
                  type: display
                  markdown: true
                  content: "حقل **الاسم الكامل** موجود دائماً وإجباري. شيّك على الحقول الثانية يلي بدك ياها تظهر، وبعدين على يلي بدها تكون إجبارية. التسجيلات بتوصل لقسم **تسجيلات الدورات** بالقائمة الجانبية، وبتتصدّر CSV."
                header.register_fields:
                  type: checkboxes
                  label: الحقول الظاهرة بالنموذج
                  default: [whatsapp]
                  options:
                    whatsapp: رقم واتساب
                    email: البريد الإلكتروني
                    age: الفئة العمرية
                    country: البلد
                    city: المدينة
                    gender: الجنس
                    qualification: المؤهل أو التخصص
                    note: "سؤال مفتوح: لماذا تريد حضور هذه الدورة؟"
                header.register_required:
                  type: checkboxes
                  label: الحقول الإجبارية
                  help: لازم تكون مشيّكة بالقائمة يلي فوق كمان، وإلا ما بتظهر أصلاً.
                  default: [whatsapp]
                  options:
                    whatsapp: رقم واتساب
                    email: البريد الإلكتروني
                    age: الفئة العمرية
                    country: البلد
                    city: المدينة
                    gender: الجنس
                    qualification: المؤهل أو التخصص
                    note: "سؤال مفتوح: لماذا تريد حضور هذه الدورة؟"
                header.register_note_label:
                  type: text
                  label: نص السؤال المفتوح
                  placeholder: "مثلاً: أي دائرة تتعبك أكثر؟"
                header.register_intro:
                  type: text
                  label: جملة فوق النموذج
                  placeholder: املأ البيانات التالية، ولا تُنشر ولا تُشارك مع أحد.
                header.register_thanks:
                  type: textarea
                  label: رسالة الشكر بعد الإرسال
                  rows: 2
                  placeholder: سجّلنا اسمك في الدورة بإذن الله، وسنتواصل معك قبل موعد البدء.
