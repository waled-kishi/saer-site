title: سلسلة / برنامج
'@extends':
  type: content-base
  context: theme://blueprints

child_type: episode

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.kind:
              type: select
              label: النوع
              default: series
              options:
                series: سلسلة حلقات
                program: برنامج (يضم سلاسل)
                course: دورة
              ordering@: header.title
            header.step_label:
              type: text
              label: اسم الخطوة (مثل نُسقِط)
              ordering@: header.kind
            header.step_no:
              type: number
              label: رقم الخطوة
              ordering@: header.step_label
            header.chips:
              type: array
              label: كلمات مفتاحية تظهر في البطاقة
              value_only: true
              ordering@: header.step_no
            header.youtube_playlist:
              type: text
              label: رابط قائمة تشغيل يوتيوب
              ordering@: header.chips
            header.youtube_sync:
              type: toggle
              label: مزامنة مع يوتيوب
              help: عند التفعيل تُضاف كل حلقة جديدة في قائمة التشغيل إلى البرنامج تلقائياً خلال ساعة. لا تُعدَّل الحلقات الموجودة.
              highlight: 1
              default: 0
              options:
                1: مفعّلة
                0: متوقفة
              validate:
                type: bool
              ordering@: header.youtube_playlist
            header.book:
              type: select
              label: الكتيّب المرتبط
              help: اختر "بدون ربط" لإلغاء الربط.
              default: ''
              data-options@: '\Grav\Theme\Saer::bookOptions'
              ordering@: header.youtube_playlist
