name: booklet
# Booklets for the programme series: Gemini writes each episode in book style,
# then a PDF, a Word version and a book page under /books (unpublished, "soon").
on:
  schedule:
    - cron: '37 4 * * *'   # pick up whatever Gemini's free quota allows each day
  workflow_dispatch:
    inputs:
      books:
        description: 'Which books: all, or keys from .saer/program_booklet.py (nabni, nusqit, nuwahhid, surya)'
        default: all
      rewrite:
        description: 'Rewrite chapters spoken -> written, linked to the previous chapter (series keys: nusqit, nuwahhid, nabni, or all)'
        default: 'nusqit,nuwahhid'
      force:
        description: 'Rebuild the files even when nothing changed (1)'
        default: ''
env:
  GRAV_API_URL: ${{ vars.GRAV_API_URL || 'https://saer1.rifd-dt.com/api/v1' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://saer1.rifd-dt.com' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get install -y -qq fonts-hosny-amiri poppler-utils >/dev/null
          pip install -q weasyprint markdown python-docx
      - name: Build the booklets
        env:
          GRAV_API_KEY: ${{ secrets.GRAV_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOOKS: ${{ github.event.inputs.books || 'all' }}
          REWRITE: ${{ github.event.inputs.rewrite || 'nusqit,nuwahhid' }}
          FORCE_PDF: ${{ github.event.inputs.force }}
        run: python3 .saer/program_booklet.py
