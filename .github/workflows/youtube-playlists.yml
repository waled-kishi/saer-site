name: youtube-playlists
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.saer/playlists.txt', '.github/workflows/youtube-playlists.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: pip install -U yt-dlp
      - name: Fetch playlists
        run: |
          mkdir -p .saer/youtube
          grep -v '^\s*#' .saer/playlists.txt | grep -v '^\s*$' | while read -r id; do
            echo "== $id"
            if yt-dlp --flat-playlist -J --extractor-args "youtube:lang=ar" "https://www.youtube.com/playlist?list=$id" > /tmp/raw.json 2>/tmp/err.txt; then
              python3 - "$id" <<'PY'
          import json, sys
          pid = sys.argv[1]
          d = json.load(open('/tmp/raw.json'))
          out = {"id": pid, "title": d.get("title"), "description": d.get("description"),
                 "videos": [{"id": e.get("id"), "title": e.get("title"), "duration": e.get("duration")}
                            for e in d.get("entries") or [] if e]}
          json.dump(out, open(f'.saer/youtube/{pid}.json', 'w'), ensure_ascii=False, indent=1)
          print(out["title"], len(out["videos"]))
          PY
            else
              echo "FAILED $id"; tail -3 /tmp/err.txt
              curl -fsSL "https://www.youtube.com/feeds/videos.xml?playlist_id=$id" -o ".saer/youtube/$id.rss.xml" || true
            fi
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .saer/youtube
          git diff --cached --quiet || git commit -m "Update YouTube playlist data"
          git push
