name: channel-playlists
# Lists every playlist on the Sheikh's channel (id, title, video count) into
# .saer/youtube/channel-playlists.json, so we can pick which ones to import.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/channel-playlists.yml']
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: pip install -U yt-dlp
      - name: List channel playlists
        run: |
          mkdir -p .saer/youtube
          yt-dlp --flat-playlist -J --extractor-args "youtube:lang=ar" \
            "https://www.youtube.com/channel/UCDFuruEz-JlglcgduqZnNmw/playlists" > /tmp/raw.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/raw.json'))
          out = [{"id": e.get("id"), "title": e.get("title"), "count": e.get("playlist_count")}
                 for e in d.get("entries") or [] if e]
          json.dump(out, open('.saer/youtube/channel-playlists.json', 'w'), ensure_ascii=False, indent=1)
          print(len(out), "playlists")
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .saer/youtube
          git diff --cached --quiet || git commit -m "Update channel playlist list"
          git pull --rebase && git push
