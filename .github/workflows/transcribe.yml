name: transcribe
# Whisper transcripts for series with "فرّغ هذه السلسلة" on (header.transcribe), or for the
# series routes given by hand. Each video runs in its own job, in parallel.
# Results: .saer/transcripts/<video id>.json (segments). Then transcribe-publish.yml takes over.
on:
  workflow_dispatch:
    inputs:
      series:
        description: 'Series route(s), comma separated (e.g. /lectures/khutab/fiqh-al-mutaghayyirat). Empty = all series with the switch on.'
        required: false
        default: ''
      model:
        description: 'Whisper model'
        required: false
        default: 'large-v3'
  schedule:
    - cron: '41 2 * * *'
permissions:
  contents: write
concurrency:
  group: transcribe
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GRAV_API_URL: https://saer1.rifd-dt.com/api/v1
          GRAV_API_KEY: ${{ secrets.GRAV_API_KEY }}
          SERIES: ${{ github.event.inputs.series }}
        run: echo "matrix=$(python3 .saer/transcribe-plan.py)" >> "$GITHUB_OUTPUT"

  whisper:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ github.event.inputs.model || 'large-v3' }}
      - name: Install
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]" faster-whisper
      - name: Download audio
        run: |
          yt-dlp -f "bestaudio" -x --audio-format mp3 --audio-quality 5 -o "/tmp/a.%(ext)s" \
            "https://www.youtube.com/watch?v=${{ matrix.item.id }}"
          ffmpeg -loglevel error -i /tmp/a.mp3 -ac 1 -ar 16000 /tmp/a.wav
      - name: Transcribe
        env:
          WHISPER_MODEL: ${{ github.event.inputs.model || 'large-v3' }}
        run: |
          mkdir -p out
          python3 .saer/whisper.py /tmp/a.wav "out/${{ matrix.item.id }}.json" "${{ matrix.item.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.item.id }}
          path: out/${{ matrix.item.id }}.json
          retention-days: 7

  commit:
    needs: whisper
    if: always() && needs.whisper.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: transcript-*
          merge-multiple: true
          path: .saer/transcripts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .saer/transcripts
          git diff --cached --quiet && exit 0
          git commit -m "Whisper transcripts ($(git diff --cached --name-only | wc -l))"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
