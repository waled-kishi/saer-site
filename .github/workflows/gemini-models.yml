name: gemini-models
# One-off helper: which Gemini models this key can actually call.
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sS "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY&pageSize=200" -o /tmp/m.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/m.json'))
          for m in d.get('models', []):
              if 'generateContent' in m.get('supportedGenerationMethods', []):
                  print(m['name'].split('/')[-1])
          print('total:', len(d.get('models', [])))
          PY
