name: yt-audio-probe
# Tries several ways to fetch audio of one video from GitHub's servers; writes the log to .saer/probe/.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yt-audio-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -q -U "yt-dlp[default]"
      - name: Probe
        run: |
          set +e; mkdir -p .saer/probe; L=.saer/probe/log.txt; V=IulgwlZ-DOM
          yt-dlp --version > $L
          for c in default tv web_safari mweb android_vr web_embedded ios; do
            echo "== $c" >> $L
            if [ $c = default ]; then A=""; else A="--extractor-args youtube:player_client=$c"; fi
            timeout 300 yt-dlp $A -f bestaudio -o "/tmp/p_$c.%(ext)s" "https://www.youtube.com/watch?v=$V" > /tmp/o.txt 2>&1
            echo "exit $?" >> $L; tail -4 /tmp/o.txt >> $L; ls -la /tmp/p_$c.* >> $L 2>&1
          done
          echo "== invidious/piped style check" >> $L
          curl -s -o /dev/null -w "%{http_code}\n" "https://www.youtube.com/watch?v=$V" >> $L
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .saer/probe && git commit -m "yt audio probe log" && git pull --rebase && git push
